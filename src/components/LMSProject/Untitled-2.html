<!-- TABLE HEADING -->
<template #tableHeadingSlot="{ tableKeys }">
  <tr>
    <template v-for="tableHeading in tableKeys" :key="tableHeading">
      <th
        v-if="tableHeading !== 'id' && tableHeading !== 'pic'"
        scope="col"
        class="sticky top-0 z-10 bg-table-head px-4 py-2 text-center text-sm font-semibold whitespace-nowrap text-table-head-text"
      >
        {{ formatLabel(tableHeading) }}
      </th>
    </template>
    <th
      scope="col"
      class="sticky top-0 z-10 bg-table-head px-4 py-2 text-center text-sm font-semibold text-table-head-text"
    >
      Actions
    </th>
  </tr>
</template>

<!-- TABLE ROW -->
<template #tableRowSlot="{ tableRow, actions }">
  <tr class="border-t border-line/30 transition-colors duration-150 hover:bg-line/10">
    <template v-for="(tableData, key) in tableRow" :key="key">
      <td
        v-if="key !== 'id' && key !== 'pic'"
        class="max-w-48 truncate px-4 py-1.5 text-center text-sm text-main"
      >
        <!-- stock badge -->
        <span
          v-if="key === 'availableInStore'"
          :class="
            tableData > 0
              ? 'bg-emerald-200 text-emerald-900 dark:bg-emerald-900/60 dark:text-emerald-100'
              : 'bg-amber-200 text-amber-900 dark:bg-amber-900/60 dark:text-amber-100'
          "
          class="inline-block rounded-full px-2 py-0.5 text-xs font-medium"
        >
          {{ tableData }}
        </span>
        <span v-else-if="key === 'rentPerDay'" class="tabular-nums">
          {{ tableData }}
        </span>
        <template v-else>{{ tableData }}</template>
      </td>
    </template>

    <!-- Actions -->
    <td class="px-4 py-1.5">
      <div class="flex items-center justify-center gap-2">
        <button
          v-for="action in actions"
          :key="action.name"
          type="button"
          :aria-label="action.name"
          @click="actionDecideFun(action, tableRow)"
          :class="
            action.name === 'delete'
              ? 'text-red-600 hover:bg-red-500/15 dark:text-red-400'
              : 'text-line hover:bg-line/15'
          "
          class="cursor-pointer rounded-md p-1 transition-colors duration-150"
        >
          <component :is="action.iconShow" class="size-4.5" />
        </button>
      </div>
    </td>
  </tr>
</template>
